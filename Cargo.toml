[package]
name = "pricebook-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
rmcp = { version = "3.8.0", features = ["transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
tower-service = "0.3.3"
worker = { version = "0.8.7", features = ["http", "axum", "d1", "experimental_tokio"] }
worker-macros = { version = "0.8.7", features = ["http"] }

[profile.release]
opt-level = "s"

# Experimental Emscripten/Tokio patchset from Cloudflare's workers-rs example.
[patch."https://github.com/guybedford/libc"]
libc = { git = "https://github.com/rust-lang/libc", branch = "libc-0.2" }

[patch.crates-io]
libc = { git = "https://github.com/rust-lang/libc", branch = "libc-0.2" }
tokio = { git = "https://github.com/guybedford/tokio", tag = "1.53.1-cf.emscripten" }
tokio-macros = { git = "https://github.com/guybedford/tokio", tag = "1.53.1-cf.emscripten" }
